databases:
  - name: gamifiedlms-db
    plan: free
    databaseName: gamifiedlms
    user: gamifiedlms

services:
  - type: web
    name: gamifiedlms
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Ollama on a developer's localhost is not reachable from Render.
      # Set GROQ_API_KEY in the Render service's Environment settings.
      - key: OLLAMA_ENABLED
        value: "false"
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # Existing services must add this secret manually in Environment.
      - key: GROQ_API_KEY
        sync: false
      - key: APP_URL
        value: https://gamifiedlms.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: gamifiedlms-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
